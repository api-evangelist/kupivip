aid: kupivip
name: KupiVIP
description: 'KupiVIP (kupivip.ru) is a Russian online outlet retailer for luxury and premium fashion, selling
  women''s and men''s apparel, footwear, bags, accessories and home goods from more than 250 international designer
  brands at discounts of up to 90% on previous-season collections. The 1C-Bitrix storefront ships across Russia,
  publishes a 100% authenticity guarantee backed by expert verification, offers free delivery on orders over
  30,000 RUB, and runs telephone, email, WhatsApp and Telegram customer support. The company was originally
  surfaced in the API Evangelist network as an Accel portfolio company. As of the 2026-07-19 enrichment probe
  KupiVIP publishes no public API, developer portal, SDK, or machine-readable interface of any kind.'
